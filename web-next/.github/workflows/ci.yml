name: CI Checks

on:
  push:
    branches: [dev, feature/*, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Dummy values for build (actual values in Railway)
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "dummy-secret-for-build"
          NEXTAUTH_URL: "http://localhost:3000"

  # Only runs on PRs to master (production)
  production-checks:
    name: Production Readiness
    runs-on: ubuntu-latest
    if: github.base_ref == 'master'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log statements
        run: |
          echo "Checking for debug console.log statements..."
          # Allow console.error and console.warn, flag console.log
          if grep -r "console\.log" --include="*.ts" --include="*.tsx" src/ | grep -v "// allowed" | head -20; then
            echo "::warning::Found console.log statements - review before production"
          fi

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          if grep -r "TODO\|FIXME\|HACK" --include="*.ts" --include="*.tsx" src/ | head -10; then
            echo "::warning::Found TODO/FIXME comments - review before production"
          fi

      - name: Production build verified
        run: echo "All production checks passed!"
