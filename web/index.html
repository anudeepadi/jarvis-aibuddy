<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #111113;
            --text-primary: #fafafa;
            --text-secondary: #888;
            --text-muted: #555;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --danger: #ef4444;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: 'Instrument Sans', -apple-system, sans-serif;
            color: var(--text-primary);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Dynamic ambient background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            transition: all 1s ease;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-bg.idle {
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 255, 255, 0.03), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255, 255, 255, 0.02), transparent);
        }

        .ambient-bg.listening {
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59, 130, 246, 0.08), transparent),
                radial-gradient(ellipse 40% 30% at 20% 80%, rgba(139, 92, 246, 0.05), transparent);
        }

        .ambient-bg.thinking {
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.08), transparent),
                radial-gradient(ellipse 40% 30% at 20% 80%, rgba(192, 132, 252, 0.05), transparent);
        }

        .ambient-bg.speaking {
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 197, 94, 0.1), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(22, 163, 74, 0.06), transparent),
                radial-gradient(ellipse 40% 30% at 20% 80%, rgba(74, 222, 128, 0.04), transparent);
        }

        /* Noise texture overlay */
        .noise-overlay {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 1;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        /* Canvas for sphere */
        #sphere-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            z-index: 5;
        }

        /* State indicator */
        .state-indicator {
            position: absolute;
            top: 40px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            z-index: 20;
            transition: all 0.3s ease;
        }

        .state-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }

        .state-indicator.listening .state-dot {
            background: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-blue);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .state-indicator.thinking .state-dot {
            background: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
            animation: pulse-dot 0.8s ease-in-out infinite;
        }

        .state-indicator.speaking .state-dot {
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: pulse-dot 1s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        .state-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* Status text */
        .status-container {
            position: absolute;
            bottom: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            z-index: 20;
            max-width: 500px;
            width: 90%;
        }

        .transcript {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            min-height: 1.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .transcript.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .transcript.listening {
            color: var(--accent-blue);
        }

        /* Response container */
        .response-container {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 550px;
            width: 90%;
            max-height: 180px;
            overflow-y: auto;
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            z-index: 20;
            opacity: 0;
            transform: translateX(-50%) translateY(-10px);
            transition: all 0.4s ease;
        }

        .response-container.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .response-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Memory indicator */
        .memory-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .memory-badge svg {
            width: 12px;
            height: 12px;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 50px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 20;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-close {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-close:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-close:hover svg {
            stroke: var(--danger);
        }

        .btn-close svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            transition: all 0.2s ease;
        }

        .btn-mic {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--text-primary);
            box-shadow:
                0 0 0 0 rgba(255, 255, 255, 0.2),
                0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: all 0.3s ease;
        }

        .btn-mic::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .btn-mic.active {
            background: var(--accent-blue);
        }

        .btn-mic.active::before {
            border-color: rgba(59, 130, 246, 0.4);
            animation: pulse-ring 2s ease-out infinite;
        }

        .btn-mic:hover {
            transform: scale(1.05);
        }

        .btn-mic:active {
            transform: scale(0.95);
        }

        .btn-mic svg {
            width: 26px;
            height: 26px;
            fill: var(--bg-primary);
            transition: all 0.3s ease;
        }

        .btn-mic.active svg {
            fill: white;
            animation: mic-pulse 1s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes mic-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .btn-settings {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-settings svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 2;
        }

        /* Continuous mode indicator */
        .continuous-badge {
            position: absolute;
            bottom: 130px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            z-index: 20;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .continuous-badge.visible {
            opacity: 1;
        }

        .continuous-badge span {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 500;
        }

        /* API Key Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            max-width: 440px;
            width: 90%;
            transform: scale(0.95) translateY(20px);
            transition: all 0.3s ease;
        }

        .modal-overlay.visible .modal {
            transform: scale(1) translateY(0);
        }

        .modal h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .modal p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-family: 'Instrument Sans', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .modal input:focus {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
        }

        .modal input::placeholder {
            color: var(--text-muted);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 0.5rem;
        }

        .toggle-label {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .toggle-label small {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle.active {
            background: var(--accent-green);
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            transition: all 0.3s ease;
        }

        .toggle.active::after {
            transform: translateX(20px);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-primary {
            flex: 1;
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            background: var(--text-primary);
            color: var(--bg-primary);
            font-family: 'Instrument Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-family: 'Instrument Sans', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .keyboard-hint kbd {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="ambient-bg idle" id="ambient-bg"></div>
    <div class="noise-overlay"></div>

    <div class="container">
        <canvas id="sphere-canvas"></canvas>

        <div class="state-indicator idle" id="state-indicator">
            <div class="state-dot"></div>
            <span class="state-label" id="state-label">Ready</span>
        </div>

        <div class="response-container" id="response-container">
            <div class="memory-badge" id="memory-badge" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                <span>Using memory</span>
            </div>
            <p class="response-text" id="response-text"></p>
        </div>

        <div class="status-container">
            <p class="transcript" id="transcript"></p>
        </div>

        <div class="continuous-badge" id="continuous-badge">
            <span>Continuous Mode</span>
        </div>

        <div class="controls">
            <button class="btn btn-close" id="btn-close" title="Stop & Reset">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="btn btn-mic" id="btn-mic" title="Start/Stop listening">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <button class="btn btn-settings" id="btn-settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>

        <div class="keyboard-hint">
            <kbd>Space</kbd> to toggle listening
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>Settings</h2>
            <p>Configure your Jarvis voice assistant.</p>

            <div class="input-group">
                <label>OpenAI API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-proj-..." autocomplete="off">
            </div>

            <div class="input-group">
                <label>Mem0 API Key (optional)</label>
                <input type="password" id="mem0-key-input" placeholder="m0-..." autocomplete="off">
            </div>

            <div class="toggle-group">
                <div class="toggle-label">
                    Continuous Mode
                    <small>Keep listening after responses</small>
                </div>
                <div class="toggle active" id="toggle-continuous"></div>
            </div>

            <div class="toggle-group">
                <div class="toggle-label">
                    Voice Responses
                    <small>Speak responses aloud</small>
                </div>
                <div class="toggle active" id="toggle-voice"></div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
                <button class="btn btn-primary" id="btn-save-settings">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Configuration
        // ============================================
        const CONFIG = {
            openaiModel: 'gpt-4o-mini',
            systemPrompt: `You are Jarvis, a highly intelligent AI assistant. Be conversational, concise, and genuinely helpful.

Key traits:
- Respond naturally in 1-3 sentences unless more detail is needed
- Be warm but professional, like a knowledgeable colleague
- Remember context from the conversation
- When given memory context, naturally incorporate relevant information

Current time: ${new Date().toLocaleString()}`,
            maxTokens: 200,
            silenceTimeout: 1500, // ms of silence before processing
        };

        // ============================================
        // State
        // ============================================
        let state = {
            isActive: false,
            isListening: false,
            isProcessing: false,
            isSpeaking: false,
            currentState: 'idle', // idle, listening, thinking, speaking
            apiKey: localStorage.getItem('openai_api_key') || '',
            mem0Key: localStorage.getItem('mem0_api_key') || '',
            continuousMode: localStorage.getItem('continuous_mode') !== 'false',
            voiceEnabled: localStorage.getItem('voice_enabled') !== 'false',
            conversationHistory: [],
            audioContext: null,
            analyser: null,
            mediaStream: null,
            recognition: null,
            silenceTimer: null,
            currentTranscript: '',
        };

        // ============================================
        // DOM Elements
        // ============================================
        const canvas = document.getElementById('sphere-canvas');
        const ctx = canvas.getContext('2d');
        const ambientBg = document.getElementById('ambient-bg');
        const stateIndicator = document.getElementById('state-indicator');
        const stateLabel = document.getElementById('state-label');
        const btnMic = document.getElementById('btn-mic');
        const btnClose = document.getElementById('btn-close');
        const btnSettings = document.getElementById('btn-settings');
        const transcriptEl = document.getElementById('transcript');
        const responseContainer = document.getElementById('response-container');
        const responseText = document.getElementById('response-text');
        const memoryBadge = document.getElementById('memory-badge');
        const continuousBadge = document.getElementById('continuous-badge');
        const modalOverlay = document.getElementById('modal-overlay');
        const apiKeyInput = document.getElementById('api-key-input');
        const mem0KeyInput = document.getElementById('mem0-key-input');
        const toggleContinuous = document.getElementById('toggle-continuous');
        const toggleVoice = document.getElementById('toggle-voice');
        const btnSaveSettings = document.getElementById('btn-save-settings');
        const btnCancelModal = document.getElementById('btn-cancel-modal');

        // ============================================
        // Color Schemes for States
        // ============================================
        const COLOR_SCHEMES = {
            idle: {
                primary: [255, 255, 255],
                secondary: [200, 200, 200],
                glow: [255, 255, 255, 0.1],
            },
            listening: {
                primary: [59, 130, 246],      // Blue
                secondary: [96, 165, 250],
                glow: [59, 130, 246, 0.3],
            },
            thinking: {
                primary: [139, 92, 246],      // Purple
                secondary: [168, 85, 247],
                glow: [139, 92, 246, 0.3],
            },
            speaking: {
                primary: [34, 197, 94],       // Green
                secondary: [74, 222, 128],
                glow: [34, 197, 94, 0.3],
            },
        };

        // ============================================
        // Particle Sphere with Color States
        // ============================================
        class ParticleSphere {
            constructor(canvas, ctx) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.particles = [];
                this.numParticles = 900;
                this.radius = 150;
                this.rotationX = 0;
                this.rotationY = 0;
                this.audioLevel = 0;
                this.targetAudioLevel = 0;
                this.breathe = 0;
                this.colorScheme = COLOR_SCHEMES.idle;
                this.targetColorScheme = COLOR_SCHEMES.idle;
                this.currentColor = [255, 255, 255];

                this.resize();
                this.createParticles();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                const size = Math.min(window.innerWidth, window.innerHeight) * 0.75;
                this.canvas.width = size * dpr;
                this.canvas.height = size * dpr;
                this.canvas.style.width = size + 'px';
                this.canvas.style.height = size + 'px';
                this.ctx.scale(dpr, dpr);
                this.centerX = size / 2;
                this.centerY = size / 2;
            }

            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    const phi = Math.acos(1 - 2 * (i + 0.5) / this.numParticles);
                    const theta = Math.PI * (1 + Math.sqrt(5)) * i;

                    this.particles.push({
                        x: Math.sin(phi) * Math.cos(theta),
                        y: Math.sin(phi) * Math.sin(theta),
                        z: Math.cos(phi),
                        baseX: Math.sin(phi) * Math.cos(theta),
                        baseY: Math.sin(phi) * Math.sin(theta),
                        baseZ: Math.cos(phi),
                        size: Math.random() * 1.8 + 0.5,
                        offset: Math.random() * Math.PI * 2,
                    });
                }
            }

            setState(stateName) {
                this.targetColorScheme = COLOR_SCHEMES[stateName] || COLOR_SCHEMES.idle;
            }

            setAudioLevel(level) {
                this.targetAudioLevel = Math.min(1, level * 2.5);
            }

            update() {
                // Smooth color interpolation
                for (let i = 0; i < 3; i++) {
                    this.currentColor[i] += (this.targetColorScheme.primary[i] - this.currentColor[i]) * 0.08;
                }

                // Audio level
                this.audioLevel += (this.targetAudioLevel - this.audioLevel) * 0.12;
                this.targetAudioLevel *= 0.92;

                // Rotation
                this.rotationY += 0.002 + this.audioLevel * 0.01;
                this.breathe += 0.015;

                const breatheScale = 1 + Math.sin(this.breathe) * 0.015;
                const audioScale = 1 + this.audioLevel * 0.35;

                // Update particles
                for (const p of this.particles) {
                    const cosY = Math.cos(this.rotationY);
                    const sinY = Math.sin(this.rotationY);

                    let x = p.baseX * cosY - p.baseZ * sinY;
                    let z = p.baseX * sinY + p.baseZ * cosY;
                    let y = p.baseY;

                    const displacement = this.audioLevel * 0.2 * Math.sin(this.breathe * 3 + p.offset);

                    p.x = x * (breatheScale + displacement);
                    p.y = y * (breatheScale + displacement);
                    p.z = z * (breatheScale + displacement);
                }
            }

            draw() {
                const size = parseInt(this.canvas.style.width);
                this.ctx.clearRect(0, 0, size, size);

                // Glow effect
                const gradient = this.ctx.createRadialGradient(
                    this.centerX, this.centerY, 0,
                    this.centerX, this.centerY, this.radius * 1.5
                );
                const [r, g, b] = this.currentColor;
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${0.05 + this.audioLevel * 0.1})`);
                gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${0.02 + this.audioLevel * 0.05})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, size, size);

                // Sort by z
                const sorted = [...this.particles].sort((a, b) => a.z - b.z);

                for (const p of sorted) {
                    const scale = (p.z + 1.5) / 2.5;
                    const radius = this.radius * (1 + this.audioLevel * 0.15);
                    const x = this.centerX + p.x * radius;
                    const y = this.centerY + p.y * radius;
                    const particleSize = p.size * scale * (1 + this.audioLevel * 0.4);
                    const alpha = 0.25 + scale * 0.75;

                    this.ctx.beginPath();
                    this.ctx.arc(x, y, particleSize, 0, Math.PI * 2);

                    // Color based on state
                    const [pr, pg, pb] = this.currentColor;
                    this.ctx.fillStyle = `rgba(${pr}, ${pg}, ${pb}, ${alpha})`;
                    this.ctx.fill();
                }
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        const sphere = new ParticleSphere(canvas, ctx);
        sphere.animate();

        // ============================================
        // State Management
        // ============================================
        function setState(newState) {
            state.currentState = newState;

            // Update UI
            ambientBg.className = `ambient-bg ${newState}`;
            stateIndicator.className = `state-indicator ${newState}`;
            sphere.setState(newState);

            const labels = {
                idle: 'Ready',
                listening: 'Listening...',
                thinking: 'Thinking...',
                speaking: 'Speaking...',
            };
            stateLabel.textContent = labels[newState] || 'Ready';

            // Update continuous badge
            if (state.continuousMode && state.isActive) {
                continuousBadge.classList.add('visible');
            } else {
                continuousBadge.classList.remove('visible');
            }
        }

        // ============================================
        // Audio Analysis
        // ============================================
        async function initAudio() {
            try {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                state.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                const source = state.audioContext.createMediaStreamSource(state.mediaStream);
                state.analyser = state.audioContext.createAnalyser();
                state.analyser.fftSize = 256;
                source.connect(state.analyser);

                analyzeAudio();
            } catch (err) {
                console.error('Audio init error:', err);
            }
        }

        function analyzeAudio() {
            if (!state.analyser || !state.isListening) return;

            const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
            state.analyser.getByteFrequencyData(dataArray);

            const average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            sphere.setAudioLevel(average / 255);

            requestAnimationFrame(analyzeAudio);
        }

        // ============================================
        // Speech Recognition
        // ============================================
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Speech recognition not supported. Please use Chrome.');
                return null;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Show interim
                if (interimTranscript) {
                    state.currentTranscript = interimTranscript;
                    transcriptEl.textContent = interimTranscript;
                    transcriptEl.className = 'transcript visible listening';

                    // Reset silence timer
                    clearTimeout(state.silenceTimer);
                    state.silenceTimer = setTimeout(() => {
                        if (state.currentTranscript && state.isListening) {
                            processUserInput(state.currentTranscript.trim());
                        }
                    }, CONFIG.silenceTimeout);
                }

                // Process final
                if (finalTranscript) {
                    clearTimeout(state.silenceTimer);
                    state.currentTranscript = '';
                    processUserInput(finalTranscript.trim());
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    stopListening();
                }
            };

            recognition.onend = () => {
                if (state.isListening && !state.isProcessing) {
                    try { recognition.start(); } catch (e) {}
                }
            };

            return recognition;
        }

        // ============================================
        // Mem0 Memory Integration
        // ============================================
        async function searchMemories(query) {
            if (!state.mem0Key) return [];

            try {
                const response = await fetch('https://api.mem0.ai/v1/memories/search/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${state.mem0Key}`,
                    },
                    body: JSON.stringify({
                        query: query,
                        filters: { user_id: 'jarvis_user' },
                        limit: 5,
                    }),
                });

                if (!response.ok) return [];

                const data = await response.json();
                return data.results || data || [];
            } catch (err) {
                console.error('Mem0 search error:', err);
                return [];
            }
        }

        async function addMemory(content) {
            if (!state.mem0Key) return;

            try {
                await fetch('https://api.mem0.ai/v1/memories/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${state.mem0Key}`,
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content }],
                        user_id: 'jarvis_user',
                    }),
                });
            } catch (err) {
                console.error('Mem0 add error:', err);
            }
        }

        // ============================================
        // OpenAI API
        // ============================================
        async function callOpenAI(userMessage, memories = []) {
            state.conversationHistory.push({ role: 'user', content: userMessage });

            let systemPrompt = CONFIG.systemPrompt;

            // Add memories if available
            if (memories.length > 0) {
                const memoryContext = memories
                    .map(m => m.memory || m.text || m.content)
                    .filter(Boolean)
                    .join('\n- ');
                systemPrompt += `\n\nRelevant memories about the user:\n- ${memoryContext}`;
            }

            const messages = [
                { role: 'system', content: systemPrompt },
                ...state.conversationHistory.slice(-12)
            ];

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiKey}`,
                    },
                    body: JSON.stringify({
                        model: CONFIG.openaiModel,
                        messages: messages,
                        max_tokens: CONFIG.maxTokens,
                        temperature: 0.7,
                    }),
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;

                state.conversationHistory.push({ role: 'assistant', content: assistantMessage });

                // Save to memory in background
                addMemory(`User: ${userMessage}\nJarvis: ${assistantMessage}`);

                return assistantMessage;
            } catch (err) {
                console.error('OpenAI error:', err);
                return "I encountered an error. Please try again.";
            }
        }

        // ============================================
        // Text-to-Speech
        // ============================================
        function speak(text) {
            return new Promise((resolve) => {
                if (!state.voiceEnabled) {
                    resolve();
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                const voices = speechSynthesis.getVoices();
                const preferredVoice = voices.find(v =>
                    v.name.includes('Samantha') ||
                    v.name.includes('Karen') ||
                    v.name.includes('Google UK')
                );
                if (preferredVoice) utterance.voice = preferredVoice;

                utterance.onstart = () => {
                    state.isSpeaking = true;
                    setState('speaking');
                    simulateSpeechAudio();
                };

                utterance.onend = () => {
                    state.isSpeaking = false;
                    resolve();
                };

                utterance.onerror = () => {
                    state.isSpeaking = false;
                    resolve();
                };

                speechSynthesis.speak(utterance);
            });
        }

        function simulateSpeechAudio() {
            if (!state.isSpeaking) return;
            sphere.setAudioLevel(0.25 + Math.random() * 0.35);
            setTimeout(simulateSpeechAudio, 80);
        }

        // ============================================
        // Main Processing Flow
        // ============================================
        async function processUserInput(text) {
            if (!text || state.isProcessing) return;

            state.isProcessing = true;
            pauseListening();
            setState('thinking');

            // Show user's text
            transcriptEl.textContent = text;
            transcriptEl.className = 'transcript visible';

            // Search memories
            const memories = await searchMemories(text);
            if (memories.length > 0) {
                memoryBadge.style.display = 'flex';
            } else {
                memoryBadge.style.display = 'none';
            }

            // Get AI response
            const response = await callOpenAI(text, memories);

            // Show response
            responseText.textContent = response;
            responseContainer.classList.add('visible');

            // Speak response
            await speak(response);

            // Done processing
            state.isProcessing = false;
            transcriptEl.textContent = '';
            transcriptEl.classList.remove('visible');

            // Continue or stop
            if (state.continuousMode && state.isActive) {
                setTimeout(() => {
                    responseContainer.classList.remove('visible');
                    memoryBadge.style.display = 'none';
                    resumeListening();
                }, 1000);
            } else {
                setState('idle');
                setTimeout(() => {
                    responseContainer.classList.remove('visible');
                    memoryBadge.style.display = 'none';
                }, 5000);
            }
        }

        // ============================================
        // Listening Controls
        // ============================================
        function startSession() {
            if (!state.apiKey) {
                showModal();
                return;
            }

            state.isActive = true;
            state.isListening = true;
            btnMic.classList.add('active');
            setState('listening');

            initAudio();

            if (!state.recognition) {
                state.recognition = initSpeechRecognition();
            }

            if (state.recognition) {
                try { state.recognition.start(); } catch (e) {}
            }
        }

        function pauseListening() {
            state.isListening = false;
            if (state.recognition) {
                try { state.recognition.stop(); } catch (e) {}
            }
        }

        function resumeListening() {
            if (!state.isActive) return;

            state.isListening = true;
            setState('listening');

            if (state.recognition) {
                try { state.recognition.start(); } catch (e) {}
            }

            analyzeAudio();
        }

        function stopSession() {
            state.isActive = false;
            state.isListening = false;
            btnMic.classList.remove('active');
            setState('idle');

            clearTimeout(state.silenceTimer);
            speechSynthesis.cancel();

            if (state.recognition) {
                try { state.recognition.stop(); } catch (e) {}
            }

            if (state.mediaStream) {
                state.mediaStream.getTracks().forEach(t => t.stop());
            }

            transcriptEl.classList.remove('visible');
            continuousBadge.classList.remove('visible');
        }

        function resetSession() {
            stopSession();
            state.conversationHistory = [];
            responseContainer.classList.remove('visible');
            memoryBadge.style.display = 'none';
        }

        // ============================================
        // Modal / Settings
        // ============================================
        function showModal() {
            modalOverlay.classList.add('visible');
            apiKeyInput.value = state.apiKey;
            mem0KeyInput.value = state.mem0Key;
            toggleContinuous.classList.toggle('active', state.continuousMode);
            toggleVoice.classList.toggle('active', state.voiceEnabled);
        }

        function hideModal() {
            modalOverlay.classList.remove('visible');
        }

        function saveSettings() {
            const apiKey = apiKeyInput.value.trim();
            const mem0Key = mem0KeyInput.value.trim();

            if (apiKey && apiKey.startsWith('sk-')) {
                state.apiKey = apiKey;
                localStorage.setItem('openai_api_key', apiKey);
            }

            if (mem0Key) {
                state.mem0Key = mem0Key;
                localStorage.setItem('mem0_api_key', mem0Key);
            }

            state.continuousMode = toggleContinuous.classList.contains('active');
            state.voiceEnabled = toggleVoice.classList.contains('active');
            localStorage.setItem('continuous_mode', state.continuousMode);
            localStorage.setItem('voice_enabled', state.voiceEnabled);

            hideModal();

            if (state.apiKey && !state.isActive) {
                startSession();
            }
        }

        // ============================================
        // Event Listeners
        // ============================================
        btnMic.addEventListener('click', () => {
            if (state.isActive) {
                stopSession();
            } else {
                startSession();
            }
        });

        btnClose.addEventListener('click', resetSession);
        btnSettings.addEventListener('click', showModal);

        btnSaveSettings.addEventListener('click', saveSettings);
        btnCancelModal.addEventListener('click', hideModal);

        toggleContinuous.addEventListener('click', () => {
            toggleContinuous.classList.toggle('active');
        });

        toggleVoice.addEventListener('click', () => {
            toggleVoice.classList.toggle('active');
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.matches('input')) {
                e.preventDefault();
                if (state.isActive) {
                    stopSession();
                } else {
                    startSession();
                }
            }

            if (e.code === 'Escape') {
                if (modalOverlay.classList.contains('visible')) {
                    hideModal();
                } else {
                    resetSession();
                }
            }
        });

        // Load voices
        speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

        // Auto-start if API key exists
        if (state.apiKey) {
            setTimeout(startSession, 500);
        }
    </script>
</body>
